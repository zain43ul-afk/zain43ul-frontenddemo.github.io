<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#171714">
  <meta name="description" content="Portfolio frontend interaktif Hafidz Zainul Mustofa.">
  <title>Hafidz — Frontend Portfolio</title>
  <style>
    :root{--acid:#dfff00;--ink:#171714;--paper:#f1eee5;--muted:#aaa79f}
    *{box-sizing:border-box}html{color-scheme:dark;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}body{margin:0;min-height:100vh;background:var(--ink);color:var(--paper);font-family:Inter,Arial,sans-serif;font-synthesis:none;overflow-x:hidden}button,a{font:inherit;color:inherit}button{cursor:pointer}a{text-decoration:none}img{image-rendering:auto}::selection{background:var(--acid);color:var(--ink)}
    .shell{min-height:100vh;padding:24px clamp(16px,3vw,48px);display:flex;flex-direction:column;position:relative;isolation:isolate;overflow:hidden}.shell:before{content:"";position:absolute;z-index:-1;width:55vw;height:55vw;left:2vw;top:9vh;border-radius:50%;background:radial-gradient(circle,rgba(223,255,0,.16),rgba(223,255,0,.025) 44%,transparent 70%);filter:blur(16px)}
    header{display:flex;align-items:center;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid #3c3b36}.brand{font-weight:800;font-size:1.2rem;letter-spacing:-.06em}.brand sup{font-size:.45rem}.live{font:600 .65rem ui-monospace,monospace;text-transform:uppercase;border-bottom:1px solid var(--acid);padding-bottom:5px}
    main{flex:1;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.75fr);gap:2vw;align-items:center;max-width:1500px;width:100%;margin:auto}.stage{position:relative;height:min(680px,75vh);min-height:560px;touch-action:pan-y;outline:none;cursor:grab}.stage:focus-visible{outline:2px solid var(--acid);outline-offset:5px;border-radius:18px}.stage.dragging{cursor:grabbing;user-select:none}
    .card{position:absolute;left:50%;top:50%;width:min(62%,450px);background:var(--paper);color:var(--ink);border:1px solid rgba(255,255,255,.13);border-radius:18px;overflow:hidden;transition:transform .58s cubic-bezier(.2,.72,.2,1),width .58s cubic-bezier(.2,.72,.2,1),opacity .38s ease,box-shadow .38s ease;will-change:transform,width,opacity;backface-visibility:hidden}.card.active{z-index:5;opacity:1;transform:translate(-50%,-50%);box-shadow:0 34px 75px rgba(0,0,0,.52),0 0 0 1px rgba(223,255,0,.55)}.card.prev{z-index:3;width:min(44%,330px);opacity:.72;transform:translate(-142%,-50%)}.card.next{z-index:3;width:min(44%,330px);opacity:.72;transform:translate(42%,-50%)}.card.hidden{z-index:1;width:min(39%,290px);opacity:0;pointer-events:none;transform:translate(-50%,-50%)}
    .visual{position:relative;aspect-ratio:4/3;background:linear-gradient(145deg,#e5e1d7,#c8c2b7);overflow:hidden}.visual img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(1.05) contrast(1.04)}.mock{position:absolute;inset:8%;border-radius:12px;background:#fff;box-shadow:0 24px 55px rgba(0,0,0,.2);overflow:hidden}.mock:before{content:"";position:absolute;inset:0 80% 0 0;background:#18181d}.mock:after{content:"";position:absolute;left:25%;right:6%;bottom:9%;height:44%;border-radius:8px;background:linear-gradient(155deg,#eeeef1 44%,var(--card-accent) 45% 52%,#f6f6f7 53%)}.mock i{position:absolute;left:25%;top:11%;width:20%;height:12%;border-radius:6px;background:#e8e8ec;box-shadow:110px 0 #e8e8ec,220px 0 #e8e8ec}.number{position:absolute;left:14px;top:14px;padding:7px 9px;border-radius:999px;background:rgba(241,238,229,.9);font:600 .55rem ui-monospace,monospace;text-transform:uppercase}.open{position:absolute;right:14px;bottom:14px;width:82px;height:82px;border-radius:50%;display:grid;place-items:center;text-align:center;background:var(--acid);font:700 .54rem ui-monospace,monospace;text-transform:uppercase}
    .info{padding:18px}.title{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding-bottom:13px;border-bottom:1px solid #bdb9b0}.title span{font:.55rem ui-monospace,monospace;color:#77746d}.title h2{margin:0 0 5px;font-size:1.45rem;letter-spacing:-.05em}.title p{margin:0;font-size:.56rem;text-transform:uppercase}.summary{min-height:40px;margin:14px 0;color:#58564f;font-size:.8rem;line-height:1.45}.tags{display:flex;gap:6px;flex-wrap:wrap}.tags span{padding:6px 8px;border:1px solid #c5c1b8;border-radius:99px;font:.5rem ui-monospace,monospace;text-transform:uppercase}
    .copy{align-self:center}.eyebrow{font:.58rem ui-monospace,monospace;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}h1{display:flex;flex-direction:column;margin:34px 0 24px;font-size:clamp(4.3rem,7vw,8rem);line-height:.71;letter-spacing:-.085em}h1 span{font-weight:700}h1 em{font-family:Georgia,serif;font-weight:400;color:var(--acid)}.copy>p{max-width:370px;color:var(--muted);font-size:.9rem;line-height:1.6}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:28px 0 44px}.chips span{border:1px solid #4b4a45;border-radius:99px;padding:9px 12px;font:.52rem ui-monospace,monospace;text-transform:uppercase}.controls{display:flex;align-items:center;gap:10px}.counter{min-width:80px;font:.6rem ui-monospace,monospace;color:#77756e}.counter b{font-size:1rem;color:var(--paper)}.arrow{width:54px;height:54px;border:1px solid #55534e;border-radius:50%;background:transparent;font-size:1.2rem}.arrow:hover,.arrow:focus-visible{background:var(--acid);color:var(--ink);border-color:var(--acid);outline:none;transform:translateY(-2px)}
    footer{padding-top:14px}.dots{display:flex;gap:4px}.dot{position:relative;flex:1;height:25px;border:0;background:transparent;padding:0}.dot:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#46453f}.dot.active:before{height:4px;background:var(--acid)}.hint{display:flex;justify-content:space-between;margin-top:2px;color:#77756e;font:.48rem ui-monospace,monospace;text-transform:uppercase;letter-spacing:.05em}
    @media(max-width:850px){.shell{padding:18px 14px}main{display:flex;flex-direction:column}.copy{order:1;width:100%;padding:44px 6px 0}.copy h1{font-size:clamp(4rem,18vw,6rem);margin:26px 0 18px}.copy>p{font-size:.78rem}.chips{margin:20px 0 26px}.controls{justify-content:center}.stage{order:2;width:100%;height:600px;min-height:600px}.card{width:min(79%,360px)}.card.prev{width:min(56%,250px);transform:translate(-129%,-50%)}.card.next{width:min(56%,250px);transform:translate(29%,-50%)}.summary{font-size:.7rem}.title h2{font-size:1.25rem}.counter{position:absolute;right:22px;margin-top:-72px;text-align:right}footer{order:3;width:100%}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.card,.arrow{transition:none!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header><a class="brand" href="#">Hafidz<sup>®</sup></a><a class="live" href="https://hafidz-frontend-portfolio.zain43ul.chatgpt.site">Live website ↗</a></header>
    <main>
      <section class="stage" id="stage" tabindex="0" role="region" aria-roledescription="carousel" aria-label="Proyek frontend"></section>
      <section class="copy">
        <span class="eyebrow">Interactive frontend portfolio</span>
        <h1><span>Project</span><em>slider.</em></h1>
        <p>Jelajahi dua belas pengalaman frontend yang berbeda—responsif, interaktif, dan dibuat untuk menunjukkan kemampuan implementasi produk digital.</p>
        <div class="chips"><span>HTML5</span><span>CSS3</span><span>JavaScript</span><span>React</span><span>Next.js</span><span>TypeScript</span></div>
        <div class="controls"><span class="counter" id="counter" aria-live="polite"></span><button class="arrow" id="previous" aria-label="Proyek sebelumnya">←</button><button class="arrow" id="next" aria-label="Proyek berikutnya">→</button></div>
      </section>
    </main>
    <footer><div class="dots" id="dots" aria-label="Pilih proyek"></div><div class="hint"><span>↔ Geser menyamping</span><span>Swipe · panah · keyboard</span></div></footer>
  </div>
  <script>
    const liveBase = "https://hafidz-frontend-portfolio.zain43ul.chatgpt.site/showcase/";
    const projects = [
      ["01","Atlas Studio","Website Frontend","Editorial architecture website with immersive imagery.",["Next.js","Responsive","Motion"],"#ff6b3d","atlas-studio","https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=2200&q=95"],
      ["02","Flowdesk","Web Application Frontend","Focused project workspace with live task controls.",["React state","Kanban","Forms"],"#8b7cff","flowdesk-app"],
      ["03","Form Objects","E-commerce Frontend","Premium storefront with filtering and cart controls.",["Commerce UI","Cart","Filters"],"#f35b3f","form-store","https://images.unsplash.com/photo-1503602642458-232111445657?auto=format&fit=crop&w=2200&q=95"],
      ["04","Nova Analytics","Dashboard & Data Visualization","Decision-ready dashboard with responsive charts.",["SVG charts","KPI","Data UI"],"#6366f1","nova-analytics"],
      ["05","Nusa Escape","Responsive Web Development","Mobile-first travel experience for every screen.",["Mobile-first","Fluid type","Touch UI"],"#ffdf69","nusa-travel","https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=2200&q=95"],
      ["06","Nadi Finance","Figma-to-Code / UI Implementation","Token-driven fintech interface with precise components.",["Design tokens","Components","Dark mode"],"#bcff5c","nadi-ui"],
      ["07","Lumen Archive","Interactive Frontend","Cinematic archive with filtering and lightbox viewing.",["Lightbox","Keyboard","Animation"],"#ff5c8a","lumen-gallery","https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&w=2200&q=95"],
      ["08","Storypress","CMS Frontend","Editorial workspace to create, search and publish.",["CRUD UI","Local storage","Search"],"#1f8f66","storypress-cms"],
      ["09","Climate Now","API Integration","Live forecast turning weather data into clear UI.",["Open-Meteo","Async states","Search"],"#56c7ff","climate-now"],
      ["10","Focus PWA","Progressive Web App","Installable focus app with offline-ready shell.",["Service worker","Manifest","Offline"],"#ff775d","focus-pwa"],
      ["11","Bite Mobile","Mobile/Cross-platform Frontend","Touch-first food discovery flow for mobile.",["App shell","Touch","Responsive"],"#ffcc3d","bite-mobile","https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=2000&q=94"],
      ["12","Clear Journal","Performance & Accessibility","Readable editorial experience with adaptive controls.",["WCAG","Core Web Vitals","Reduced motion"],"#27c47d","clear-journal","https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=2000&q=94"]
    ];
    const stage = document.querySelector("#stage"), dots = document.querySelector("#dots"), counter = document.querySelector("#counter"); let active = 0, startX = 0, currentX = 0, moved = false;
    const position = index => index === active ? "active" : index === (active - 1 + projects.length) % projects.length ? "prev" : index === (active + 1) % projects.length ? "next" : "hidden";
    function draw(){stage.innerHTML = projects.map((p,i)=>`<a class="card ${position(i)}" style="--card-accent:${p[5]}" href="${liveBase+p[6]}" ${i===active?'':'tabindex="-1" aria-hidden="true"'} data-index="${i}"><div class="visual">${p[7]?`<img src="${p[7]}" alt="Pratinjau antarmuka ${p[1]}" draggable="false">`:`<div class="mock"><i></i></div>`}<span class="number">Project / ${p[0]}</span><span class="open">View<br>project ↗</span></div><div class="info"><div class="title"><span>${p[0]}</span><div><h2>${p[1]}</h2><p>${p[2]}</p></div><b>↗</b></div><p class="summary">${p[3]}</p><div class="tags">${p[4].map(t=>`<span>${t}</span>`).join("")}</div></div></a>`).join(""); counter.innerHTML=`<b>${String(active+1).padStart(2,"0")}</b> / ${String(projects.length).padStart(2,"0")}`; dots.innerHTML=projects.map((p,i)=>`<button class="dot ${i===active?'active':''}" data-dot="${i}" aria-label="Buka ${p[1]}" ${i===active?'aria-current="true"':''}></button>`).join("")}
    function move(direction){active=(active+direction+projects.length)%projects.length;draw()}
    stage.addEventListener("click",event=>{const card=event.target.closest(".card");if(card&&Number(card.dataset.index)!==active){event.preventDefault();active=Number(card.dataset.index);draw()}else if(moved){event.preventDefault()}});
    dots.addEventListener("click",event=>{const dot=event.target.closest(".dot");if(dot){active=Number(dot.dataset.dot);draw()}});document.querySelector("#previous").onclick=()=>move(-1);document.querySelector("#next").onclick=()=>move(1);
    stage.addEventListener("keydown",event=>{if(event.key==="ArrowLeft"){event.preventDefault();move(-1)}if(event.key==="ArrowRight"){event.preventDefault();move(1)}if(event.key==="Home"){event.preventDefault();active=0;draw()}if(event.key==="End"){event.preventDefault();active=projects.length-1;draw()}});
    stage.addEventListener("pointerdown",event=>{if(event.button!==0)return;startX=currentX=event.clientX;moved=false;stage.classList.add("dragging");stage.setPointerCapture(event.pointerId)});stage.addEventListener("pointermove",event=>{currentX=event.clientX;if(Math.abs(currentX-startX)>7)moved=true});stage.addEventListener("pointerup",event=>{const distance=currentX-startX;stage.classList.remove("dragging");if(stage.hasPointerCapture(event.pointerId))stage.releasePointerCapture(event.pointerId);if(Math.abs(distance)>50)move(distance>0?-1:1);setTimeout(()=>moved=false,0)});stage.addEventListener("pointercancel",()=>stage.classList.remove("dragging"));draw();
  </script>
</body>
</html>
